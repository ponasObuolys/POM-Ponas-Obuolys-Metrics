name: Patikra

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Kompiliavimas ir testai
    runs-on: macos-latest

    steps:
      - name: Parsisiunčiamas kodas
        uses: actions/checkout@v5

      - name: Swift versija
        run: swift --version

      - name: Kompiliuojama
        run: swift build -c release

      - name: Testai
        run: swift run pom-tests

      - name: Scenarijų sintaksė
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit 1
          done

      - name: Claude prijungimas ir Fable perdavimas
        run: python3 tests/bridge_tests.py

      # Netaisyklingas numeris paaiškėtų tik leidimo metu, kai jau vėlu: DMG pavadinimas
      # ir programos vidus paimami būtent iš šio failo.
      - name: Versijos numerio forma
        run: |
          version="$(tr -d '[:space:]' <VERSION)"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION faile turi būti numeris pavidalu X.Y.Z, dabar yra: $version"
            exit 1
          fi
          echo "Versija: $version"
