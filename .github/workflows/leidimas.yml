name: Signed release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Universal DMG, notarization and signed updates
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      POM_SIGN_IDENTITY: ${{ secrets.POM_SIGN_IDENTITY }}
      POM_SPARKLE_PRIVATE_KEY: ${{ secrets.POM_SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check tag and required signing credentials
        env:
          POM_CERTIFICATE_P12: ${{ secrets.POM_CERTIFICATE_P12 }}
          POM_CERTIFICATE_PASSWORD: ${{ secrets.POM_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Run this workflow from the matching release tag.'; exit 1; }
          bash scripts/ci-signing-setup.sh
      - name: Test core and bridge
        run: |
          swift run pom-tests
          python3 tests/bridge_tests.py
      - name: Build, sign, notarize and verify feed
        run: bash scripts/release.sh
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "$GITHUB_REF_NAME" "dist/POM-$version.dmg" "dist/POM-$version.dmg.sha256" dist/appcast.xml \
            --verify-tag --title "POM $version" --notes-file "docs/releases/$version.md"
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/pom-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/pom-certificate.p12" "$RUNNER_TEMP/pom-notary-key.p8"
